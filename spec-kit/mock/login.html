<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talent Institute — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F5F5F7;
      --surface: #FFFFFF;
      --text-primary: #1D1D1F;
      --text-secondary: #6E6E73;
      --accent: #0071E3;
      --accent-hover: #0077ED;
      --border: #D2D2D7;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-card: 0 2px 20px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 52px 48px;
      width: 100%;
      max-width: 420px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-mark {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #0071E3, #34AADC);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .logo-mark svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    .logo-area h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .logo-area p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      color: var(--text-primary);
      background: #FAFAFA;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,113,227,0.12);
      background: #FFFFFF;
    }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 28px;
    }

    .role-btn {
      padding: 10px 8px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #FAFAFA;
      font-family: 'Manrope', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .role-btn.active {
      border-color: var(--accent);
      background: rgba(0,113,227,0.06);
      color: var(--accent);
    }

    .role-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 8px;
      letter-spacing: -0.1px;
    }

    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .demo-links {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .demo-links p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .demo-links a {
      display: inline-block;
      margin: 4px 6px;
      padding: 7px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.15s;
    }

    .demo-links a:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,113,227,0.05);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <h1>Talent Institute</h1>
      <p>Sistema Institucional</p>
    </div>

    <form onsubmit="return false;">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" placeholder="nombre@talentinstitute.edu" value="supervisora@talentinstitute.edu">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" placeholder="••••••••" value="••••••••">
      </div>

      <div class="form-group">
        <span class="role-label">Ingresar como</span>
        <div class="role-selector">
          <button class="role-btn active">Supervisora</button>
          <button class="role-btn">Monitora</button>
          <button class="role-btn">Principal</button>
        </div>
      </div>

      <a href="dashboard.html">
        <button class="btn-primary">Iniciar Sesión</button>
      </a>
    </form>

    <div class="demo-links">
      <p>Acceso rápido a vistas de demostración</p>
      <a href="dashboard.html">Dashboard Supervisora</a>
      <a href="student.html">Perfil Alumno</a>
    </div>
  </div>
</body>
</html>
