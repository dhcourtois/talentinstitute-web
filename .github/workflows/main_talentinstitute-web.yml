# CI/CD — Talent Institute ACE
# Estructura de ramas:
#   develop → CI + deploy a staging (automático)
#   main    → CI + deploy a producción (requiere aprobación manual)

name: CI/CD — Talent Institute

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Build y pruebas del backend (.NET)
  # ──────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        working-directory: backend
        run: dotnet test --no-build --configuration Release --verbosity minimal

      - name: Publish
        working-directory: backend
        run: dotnet publish TalentInstitute.API -c Release -o ${{ runner.temp }}/backend-publish

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ${{ runner.temp }}/backend-publish
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Build del frontend (Angular)
  # ──────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npx ng build --configuration production

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: Ensamblaje — combina backend + frontend en un solo artefacto
  # ──────────────────────────────────────────────────────────────────────────
  assemble:
    name: Assemble — Backend + Frontend
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    # Solo en pushes a develop o main (no en PRs)
    if: github.event_name != 'pull_request'

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: app

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: app/wwwroot

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4a: Deploy a Staging (develop → automático)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: assemble
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://talentinstitute-web.azurewebsites.net

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: app

      - name: Deploy to Azure Web App (Staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'talentinstitute-web'
          slot-name: 'Production'
          package: app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_60FCFC808AC342878CA1DB168B21A733 }}
        # NOTA: El startup command 'dotnet TalentInstitute.API.dll' está configurado
        # en Azure App Service → Configuration → General settings para evitar que
        # Oryx auto-detecte el DLL incorrecto si quedan archivos de deploys anteriores.

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4b: Deploy a Producción (main → aprobación manual requerida)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: assemble
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://talentinstitute-web.azurewebsites.net

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: app

      - name: Deploy to Azure Web App (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'talentinstitute-web'
          slot-name: 'Production'
          package: app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_60FCFC808AC342878CA1DB168B21A733 }}
